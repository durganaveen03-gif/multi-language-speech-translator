<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Multi Language Speech Translator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <nav class="navbar navbar-dark bg-primary shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <i class="fa-solid fa-language"></i>
                Multi Language Speech Translator
            </a>

            <button id="darkMode" class="btn btn-light">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">

                <div class="card shadow-lg rounded-4 p-4">

                    <h2 class="text-center text-primary mb-4">
                        🌍 Speak • Translate • Listen
                    </h2>

                    <div class="row">

                        <div class="col-md-5">

                            <label class="fw-bold">
                                From Language
                            </label>

                            <select class="form-select mb-3" id="from_lang">
                                <option value="auto">Auto Detect</option>
                                <option value="en">English</option>
                                <option value="te">Telugu</option>
                                <option value="hi">Hindi</option>
                                <option value="ta">Tamil</option>
                                <option value="kn">Kannada</option>
                                <option value="ml">Malayalam</option>
                                <option value="fr">French</option>
                                <option value="de">German</option>
                                <option value="es">Spanish</option>
                                <option value="ja">Japanese</option>
                                <option value="ko">Korean</option>
                                <option value="zh-CN">Chinese</option>
                            </select>

                        </div>

                        <div class="col-md-2 text-center">

                            <br>

                            <button class="btn btn-warning mt-2" id="swap">
                                <i class="fa-solid fa-right-left"></i>
                            </button>

                        </div>

                        <div class="col-md-5">

                            <label class="fw-bold">
                                To Language
                            </label>

                            <select class="form-select mb-3" id="to_lang">
                                <option value="te">Telugu</option>
                                <option value="en">English</option>
                                <option value="hi">Hindi</option>
                                <option value="ta">Tamil</option>
                                <option value="kn">Kannada</option>
                                <option value="ml">Malayalam</option>
                                <option value="fr">French</option>
                                <option value="de">German</option>
                                <option value="es">Spanish</option>
                                <option value="ja">Japanese</option>
                                <option value="ko">Korean</option>
                                <option value="zh-CN">Chinese</option>
                            </select>

                        </div>

                    </div>

                    <label class="fw-bold">
                        Speech / Text
                    </label>

                    <textarea
                        id="speech"
                        class="form-control"
                        rows="6"
                        placeholder="Speak or type your text here..."></textarea>

                    <div class="text-center mt-4">

                        <button class="btn btn-danger btn-lg rounded-circle me-2" id="record">
                            <i class="fa-solid fa-microphone"></i>
                        </button>

                        <button class="btn btn-primary btn-lg me-2" id="translate">
                            <i class="fa-solid fa-language"></i>
                            Translate
                        </button>

                        <button class="btn btn-success btn-lg" id="listen">
                            <i class="fa-solid fa-volume-high"></i>
                            Listen
                        </button>
                        <button id="aiBtn" class="btn btn-warning">
                           🤖 AI Explain
                        </button>
                    </div>

                    <hr>

                    <label class="fw-bold">
                      <label class="fw-bold">
    Translated Text
</label>

<textarea
    id="result"
    class="form-control"
    rows="6"
    readonly></textarea>

<hr>

<label class="fw-bold mt-3">
    🤖 AI Explanation
</label>

<textarea
    id="aiResult"
    class="form-control"
    rows="5"
    placeholder="AI explanation will appear here..."
    readonly></textarea>

<div class="text-center mt-3">
    <button class="btn btn-warning" id="aiBtn">
        🤖 AI Explain
    </button>
</div>

<div class="mt-3 text-center">

    <button class="btn btn-secondary me-2" id="copy">
        <i class="fa-solid fa-copy"></i>
        Copy
    </button>

                        <button class="btn btn-info me-2" id="clear">
                            <i class="fa-solid fa-trash"></i>
                            Clear
                        </button>

                        <button class="btn btn-dark" id="historyBtn">
                            <i class="fa-solid fa-clock-rotate-left"></i>
                            History
                        </button>

                    </div>

                    <!-- History Section -->

                    <div class="mt-5">

                        <h4 class="text-primary">
                            <i class="fa-solid fa-clock-rotate-left"></i>
                            Translation History
                        </h4>

                        <div class="card shadow rounded-4">

                            <div class="card-body">

                                <ul class="list-group" id="historyList">

                                    <li class="list-group-item text-center">
                                        No History Available
                                    </li>

                                </ul>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <footer class="bg-primary text-white text-center p-3 mt-5">

        <h6>
            Developed By Durga ❤️
        </h6>

        <p>
            Multi Language Speech Translator using Flask, AI, Speech Recognition and Google Translate
        </p>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
